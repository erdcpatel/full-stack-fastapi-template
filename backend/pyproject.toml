[project]
name = "app"
version = "0.1.0"
description = "Lightweight FastAPI backend with external auth"
requires-python = ">=3.13,<4.0"
dependencies = [
    "fastapi[standard]>=0.141.1,<1.0.0",
    "python-multipart<1.0.0,>=0.0.27",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.2.1,<3.0.0",
    "httpx>=0.25.1,<1.0.0",
    "pyjwt>=2.10.0,<3.0.0",
    "sentry-sdk[fastapi]>=2.70.0,<3.0.0",
]

[dependency-groups]
dev = [
    "pytest>=7.4.3,<10.0.0",
    "mypy>=1.8.0,<3.0.0",
    "ruff>=0.16.0,<1.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.mypy]
strict = true
exclude = ["venv", ".venv"]

[tool.ruff]
target-version = "py313"

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "B",
    "C4",
    "UP",
]
ignore = [
    "E501",
    "B008",
    "W191",
    "B904",
]

[tool.fastapi]
entrypoint = "app.main:app"
